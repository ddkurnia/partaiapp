<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="circle512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg512)"/>
  <!-- Subtle grid pattern -->
  <rect x="50" y="50" width="412" height="412" rx="70" ry="70" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  <!-- Decorative outer ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#10b981" stroke-width="1" opacity="0.12"/>
  <!-- Emerald circle with glow -->
  <circle cx="256" cy="256" r="170" fill="url(#circle512)" filter="url(#shadow512)"/>
  <!-- Inner circle highlight -->
  <circle cx="256" cy="240" r="138" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <!-- Letter P -->
  <text x="256" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="210" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="-6">P</text>
  <!-- Subtle accent dots -->
  <circle cx="256" cy="412" r="6" fill="#10b981" opacity="0.6"/>
  <circle cx="238" cy="418" r="4" fill="#10b981" opacity="0.3"/>
  <circle cx="274" cy="418" r="4" fill="#10b981" opacity="0.3"/>
</svg>