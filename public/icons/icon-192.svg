<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="circle192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="36" ry="36" fill="url(#bg192)"/>
  <!-- Subtle grid pattern -->
  <rect x="20" y="20" width="152" height="152" rx="26" ry="26" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <!-- Emerald circle with glow -->
  <circle cx="96" cy="96" r="64" fill="url(#circle192)" filter="url(#shadow192)"/>
  <!-- Inner circle highlight -->
  <circle cx="96" cy="90" r="52" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Letter P -->
  <text x="96" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="-2">P</text>
  <!-- Subtle accent dot -->
  <circle cx="96" cy="155" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="86" cy="158" r="2" fill="#10b981" opacity="0.3"/>
  <circle cx="106" cy="158" r="2" fill="#10b981" opacity="0.3"/>
</svg>